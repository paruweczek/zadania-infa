<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    </style>
    <script>
        function valid(){
        var data = document.getElementById("data").value;
        var gender = document.querySelector('input[name="plec"]:checked')?.value || "";
        var pesel = document.getElementById("pesel").value;
        var wynik = document.getElementById("wynik");
        var debug = document.getElementById("debug");
        console.log(data[3] + " " + gender + " " + pesel);

        if (data =="" || gender=="" || pesel == "" ){
            wynik.innerHTML="cos nie wpisałeś";
            return false;
        } else if (pesel.length != 11 || !/^\d{11}$/.test(pesel)) { 
            wynik.innerHTML = "PESEL musi mieć 11 cyfr";
            return false;
        } else {

            var rok = Number(pesel.substring(0, 2));
            var miesiac = Number(pesel.substring(2, 4));
            var dzien = Number(pesel.substring(4, 6));
            var rok_full;

            if (miesiac >= 1 && miesiac <= 12){
                rok_full = 1900 + rok;
            } else if (miesiac >= 21 && miesiac <= 32){
                rok_full = 2000 + rok;
                miesiac -= 20;
            } else if (miesiac >= 81 && miesiac <= 92){
                rok_full = 1800 + rok;
                miesiac -= 80;
            } else {
                wynik.innerHTML = "Niepoprawny miesiąc w PESEL";
                return false;
            }

            var sprawdzDate = new Date(rok_full, miesiac - 1, dzien);
            if (sprawdzDate.getFullYear() != rok_full ||
                sprawdzDate.getMonth() != miesiac-1 ||
                sprawdzDate.getDate() != dzien){

                wynik.innerHTML="Niepoprawna data urodzenia";
                return false;
            }
            
            var dataPesel = rok_full + "-" +
                String(miesiac).padStart(2, "0") + "-" +
                String(dzien).padStart(2, "0");

            if (data != dataPesel) {
                wynik.innerHTML = "Data nie zgadza się z PESEL";
                return false;
            }            
            
            var plecPesel;
                            
            if (Number(pesel[9]) % 2 == 0) {
                plecPesel = "k";
            } else {
                plecPesel = "m";
            }
            
            if (gender != plecPesel) {
                wynik.innerHTML = "Płeć nie zgadza się z PESEL";
                return false;
            }
            
            var wagi = [1, 3, 7, 9, 1, 3, 7, 9, 1, 3];
            var suma = 0;
            for (var i = 0; i < wagi.length; i++){
                suma += Number(pesel[i]) * wagi[i];
            }
            var kontrolna = (10 - suma % 10) % 10;
           if (kontrolna != Number(pesel[10])) {
                wynik.innerHTML = "Niepoprawna cyfra kontrolna";
            return false;
            }
            wynik.innerHTML="Pesel poprawny";
            return true;
        }
            
    }
    

    </script>
</head>
<body>
    <h1>super duper validator</h1>
    <form name="form" id="form" onsubmit="valid(); return false;">
        <label for="data">Wpisz datę urodzenia</label>
        <input type="date" name="data" id="data"><br>
        Podaj płeć:
        <input type="radio" name="plec" id="plec" value="m">
        <label for="m">Mężczyzna</label>
        <input type="radio" name="plec" id="plec" value="k">
        <label for="k">Kobieta</label><br>
        <label for="pesel">Podaj PESEL</label>
        <input type="text" name="pesel" id="pesel" maxlength="11"><br>
        <input type="submit" value="Sprawdź PESEL">
    </form>
     <p id="wynik"></p>
     <p id="debug"></p>
</body>
</html>
